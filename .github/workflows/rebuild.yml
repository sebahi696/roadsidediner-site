# Rebuilds the site from the live Supabase menu every day (and on demand), commits only if something changed.
name: Rebuild site
on:
  schedule: [{cron: '17 3 * * *'}]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 _build/web-site/build.py /tmp/out
      - run: rsync -a --delete --exclude .git --exclude _build --exclude .github --exclude README.md /tmp/out/ ./
      - run: |
          git add -A
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git -c user.name="site-bot" -c user.email="actions@github.com" commit -m "Daily menu refresh $(date -u +%F)"
          git push
